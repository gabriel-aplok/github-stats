name: Generate Stats Images

on:
  push:
    branches: [ main ]
  schedule:
    # 10:10 utc, which is 07:10 in brazil. quieter hour for github runners.
    - cron: "10 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build -o github-stats .

    # pushes and nightly runs only rewrite the cards, so skip the suite there.
    # it still runs on manual runs and on prs.
    - name: Test
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
      run: go test ./...

    - name: Generate images
      run: ./github-stats
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_USER: ${{ github.repository_owner }}
        EXCLUDED: ${{ vars.EXCLUDED }}
        EXCLUDED_LANGS: ${{ vars.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: ${{ vars.EXCLUDE_FORKED_REPOS }}
        STATS_JSON: ${{ vars.STATS_JSON }}

    - name: Commit to the repo
      if: github.event_name != 'pull_request'
      run: |
        if [ -z "$(git status --porcelain generated)" ]; then
          echo "No change in generated images"
          exit 0
        fi
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add generated
        git commit -m 'update generated files'
        git push
